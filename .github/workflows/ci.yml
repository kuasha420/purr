name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install PyQt6

      - name: Syntax & Lint Check
        run: |
          python -m py_compile bin/purr bin/purr-tray bin/purr-integrate
          python -c "import ast; ast.parse(open('bin/purr').read())"
          python -c "import ast; ast.parse(open('bin/purr-tray').read())"
          python -c "import ast; ast.parse(open('bin/purr-integrate').read())"

      - name: Shell Scripts Syntax Check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n setup-ecosystem.sh
          bash -n completions/purr.bash

      - name: Test CLI Execution
        run: |
          ./bin/purr --version
          ./bin/purr --help
          python -c "
          import sys
          sys.path.insert(0, 'bin')
          from importlib.machinery import SourceFileLoader
          mod = SourceFileLoader('purr', 'bin/purr').load_module()
          print('Heuristic engine loaded successfully')
          "

      - name: Validate PKGBUILD & .SRCINFO
        run: |
          grep -q "pkgname=purr" PKGBUILD
          grep -q "pkgver=1.0.0" PKGBUILD
          grep -q "pkgname = purr" .SRCINFO
          grep -q "pkgver = 1.0.0" .SRCINFO
