<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- KDE Plasma & Arch Gradient -->
    <linearGradient id="plasmaArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1793D1"/>    <!-- Arch Cyan -->
      <stop offset="50%" stop-color="#3DAEE9"/>   <!-- Plasma Blue -->
      <stop offset="100%" stop-color="#2ECC71"/>  <!-- Purr Green -->
    </linearGradient>
    
    <!-- Warm Golden Glow for Tuki -->
    <linearGradient id="tukiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F78C6C"/>
    </linearGradient>

    <!-- Dark Container Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222A"/>
      <stop offset="100%" stop-color="#11141A"/>
    </linearGradient>

    <filter id="glowShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1793D1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#darkBg)" filter="url(#glowShadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="url(#plasmaArchGrad)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Stylized Feline Silhouette & Arch Gateway (Tuki Tribute) -->
  <!-- Cat Ears & Head -->
  <path d="M40 50 L34 26 L56 40 Q64 36 72 40 L94 26 L88 50 Q100 66 96 82 Q90 102 64 102 Q38 102 32 82 Q28 66 40 50 Z" 
        fill="url(#plasmaArchGrad)" opacity="0.95"/>
  
  <!-- Inner Calm Face / Whisker Accents -->
  <path d="M52 64 Q64 74 76 64" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="56" r="3.5" fill="#FFFFFF"/>
  <circle cx="78" cy="56" r="3.5" fill="#FFFFFF"/>
  
  <!-- Little Star of Serenity (Tuki's Beacon) -->
  <path d="M64 20 Q64 26 70 26 Q64 26 64 32 Q64 26 58 26 Q64 26 64 20 Z" fill="url(#tukiGlow)"/>
</svg>
